name: CD

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
      - develop

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      vars.CD_ENABLED == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    environment: ${{ github.event.workflow_run.head_branch == 'main' && 'production' || 'development' }}
    concurrency:
      group: deploy-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: false
    steps:
      - name: Verify latest branch commit
        id: freshness
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          current_sha="$(gh api \
            "repos/${GITHUB_REPOSITORY}/git/ref/heads/${HEAD_BRANCH}" \
            --jq '.object.sha')"
          if [[ "${current_sha}" == "${HEAD_SHA}" ]]; then
            echo 'should_deploy=true' >> "${GITHUB_OUTPUT}"
          else
            echo 'should_deploy=false' >> "${GITHUB_OUTPUT}"
            echo "::notice::Skipping stale ${HEAD_SHA}; ${HEAD_BRANCH} is now ${current_sha}."
          fi

      - name: Checkout validated commit
        if: steps.freshness.outputs.should_deploy == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node.js
        if: steps.freshness.outputs.should_deploy == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build ARM64 release bundle
        if: steps.freshness.outputs.should_deploy == 'true'
        run: bash scripts/build-release.sh release-output

      - name: Configure AWS credentials
        if: steps.freshness.outputs.should_deploy == 'true'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: GitHubActions-${{ github.run_id }}
          aws-region: ap-northeast-2
          allowed-account-ids: '585384908164'

      - name: Upload release
        if: steps.freshness.outputs.should_deploy == 'true'
        env:
          ARTIFACT_BUCKET: ${{ vars.ARTIFACT_BUCKET }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          aws s3 cp release-output/release.tar.gz \
            "s3://${ARTIFACT_BUCKET}/releases/${BRANCH}/${COMMIT_SHA}.tar.gz" \
            --sse AES256
          aws s3 cp release-output/release.tar.gz.sha256 \
            "s3://${ARTIFACT_BUCKET}/releases/${BRANCH}/${COMMIT_SHA}.tar.gz.sha256" \
            --sse AES256

      - name: Deploy notification web push worker
        if: steps.freshness.outputs.should_deploy == 'true'
        env:
          BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          function_name="gachisallim-${BRANCH}-notification-web-push"
          aws lambda update-function-code \
            --function-name "${function_name}" \
            --zip-file fileb://release-output/notification-web-push.zip \
            --no-publish \
            >/dev/null
          aws lambda wait function-updated \
            --function-name "${function_name}"
          aws lambda get-function-configuration \
            --function-name "${function_name}" \
            --query '{FunctionName:FunctionName,CodeSha256:CodeSha256,LastUpdateStatus:LastUpdateStatus}'

      - name: Deploy through Systems Manager
        if: steps.freshness.outputs.should_deploy == 'true'
        env:
          DOCUMENT_NAME: ${{ github.event.workflow_run.head_branch == 'main' && 'GachiSallimDeployMain' || 'GachiSallimDeployDevelop' }}
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          instance_id="$(aws ec2 describe-instances \
            --filters \
              Name=tag:GachiSallimDeploymentTarget,Values=true \
              Name=instance-state-name,Values=running \
            --query 'Reservations[].Instances[].InstanceId | [0]' \
            --output text)"
          if [[ -z "${instance_id}" || "${instance_id}" == 'None' ]]; then
            echo 'No running deployment target instance was found.' >&2
            exit 1
          fi

          command_id="$(aws ssm send-command \
            --instance-ids "${instance_id}" \
            --document-name "${DOCUMENT_NAME}" \
            --parameters "CommitSha=${COMMIT_SHA}" \
            --timeout-seconds 900 \
            --query 'Command.CommandId' \
            --output text)"

          deadline=$((SECONDS + 900))
          status='Pending'
          while (( SECONDS < deadline )); do
            status="$(aws ssm get-command-invocation \
              --command-id "${command_id}" \
              --instance-id "${instance_id}" \
              --query 'Status' \
              --output text 2>/dev/null || true)"
            case "${status}" in
              Success|Cancelled|TimedOut|Failed)
                break
                ;;
              *)
                sleep 5
                ;;
            esac
          done

          status="$(aws ssm get-command-invocation \
            --command-id "${command_id}" \
            --instance-id "${instance_id}" \
            --query 'Status' \
            --output text 2>/dev/null || true)"
          aws ssm get-command-invocation \
            --command-id "${command_id}" \
            --instance-id "${instance_id}" \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
            || true
          if [[ "${status}" != 'Success' ]]; then
            echo "SSM deployment did not succeed before the 900-second deadline: ${status}" >&2
            exit 1
          fi
