name: 버그 제보
description: 재현 가능한 버그를 제보합니다.
title: '[버그]: '
labels: ['bug']
body:
  - type: textarea
    id: summary
    attributes:
      label: 요약
      description: 어떤 문제가 발생했나요?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 재현 방법
      description: 문제를 재현하는 데 필요한 최소 단계를 작성해 주세요.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대 동작
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 실제 동작
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 실행 환경
      placeholder: local, dev, prod
