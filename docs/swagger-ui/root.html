<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>같이살림 API Docs</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        color: #202124;
        background: #f7f8fa;
      }

      main {
        box-sizing: border-box;
        width: min(720px, 100%);
        margin: 0 auto;
        padding: 56px 24px;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 32px;
        line-height: 1.2;
      }

      p {
        margin: 0 0 28px;
        color: #5f6368;
        font-size: 16px;
        line-height: 1.6;
      }

      nav {
        display: grid;
        gap: 12px;
      }

      a {
        display: block;
        padding: 18px 20px;
        border: 1px solid #dfe3e8;
        border-radius: 8px;
        color: #174ea6;
        background: #ffffff;
        font-size: 18px;
        font-weight: 600;
        text-decoration: none;
      }

      a:hover {
        border-color: #174ea6;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>같이살림 API Docs</h1>
      <p>확인할 OpenAPI 문서 브랜치를 선택하세요.</p>
      <nav aria-label="OpenAPI 문서">
        <a href="./main/">main</a>
        <a href="./develop/">develop</a>
      </nav>
    </main>
  </body>
</html>
